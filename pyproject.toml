[project]
name = "video-knowledge-extractor"
version = "0.1.0"
description = "Turn any YouTube channel into structured, analysed knowledge — in any language."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "excoms.ai" }]
keywords = ["youtube", "transcription", "whisper", "analysis", "llm", "argument-mining"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["yt-dlp>=2024.1.1"]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]
mlx = ["mlx-whisper>=0.4"]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
all = ["faster-whisper>=1.0", "anthropic>=0.40", "openai>=1.40"]

[project.scripts]
vke = "vke.cli:main"

[project.urls]
Homepage = "https://github.com/excoms/video-knowledge-extractor"
Issues = "https://github.com/excoms/video-knowledge-extractor/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vke"]
