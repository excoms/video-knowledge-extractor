name: Desktop builds

# Windows binaries cannot be produced on macOS and vice versa, so the only
# honest way to ship both is to build each on its own runner.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            artifact: vke-macos-arm64
          - os: windows-latest
            artifact: vke-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[asr,anthropic,openai]"
          python -m pip install pyinstaller

      - name: Tests
        run: python tests/run_all.py

      - name: Build
        run: pyinstaller packaging/vke.spec --noconfirm

      # ffmpeg is a separate binary, not a Python package. Shipping it inside
      # the bundle avoids a first-run failure that would look like our bug.
      - name: Bundle ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg
          cp "$(brew --prefix)/bin/ffmpeg" "dist/Video Knowledge Extractor.app/Contents/MacOS/" || \
            cp "$(brew --prefix)/bin/ffmpeg" dist/VideoKnowledgeExtractor/

      - name: Bundle ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg -y --no-progress
          copy "C:\ProgramData\chocolatey\bin\ffmpeg.exe" dist\VideoKnowledgeExtractor\

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "macOS" ]; then
            zip -qry "../${{ matrix.artifact }}.zip" "Video Knowledge Extractor.app"
          else
            7z a "../${{ matrix.artifact }}.zip" VideoKnowledgeExtractor/ > /dev/null
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          retention-days: 30
